[project]
name = "threat-nexus"
version = "0.1.0"
description = "Threat Nexus cyber threat intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "motor>=3.5.0",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.9.0",
    "discord.py>=2.4.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "coverage>=7.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# Depends()/Query() in signatures is the FastAPI idiom.
ignore = ["B008", "UP046"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
# motor's AsyncIOMotorDatabase generic and celery's untyped task decorator.
disable_error_code = ["type-arg", "untyped-decorator"]
