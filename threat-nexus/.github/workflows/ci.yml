name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: threat-nexus
      - run: ruff check .
        working-directory: threat-nexus
      - run: mypy core apps
        working-directory: threat-nexus
      - run: coverage run -m pytest && coverage report --fail-under=80
        working-directory: threat-nexus
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: threat-nexus/frontend
      - run: npm run lint
        working-directory: threat-nexus/frontend
